name: deploy-canary (Deploy storybook environments to Github Pages)

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  react:
    if: github.repository == 'jeffchew/carbon-for-ibm-dotcom'
    runs-on: ubuntu-20.04
#    env:
#      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js 14.x
        uses: actions/setup-node@v2
        with:
          node-version: '14.x'
          cache: 'yarn'
      - name: Install dependencies
        run: yarn install --offline
      - name: Build project
        run: yarn lerna run --stream --ignore @carbon/ibmdotcom-web-components --ignore @carbon/ibmdotcom-services-store build
      - name: Set env vars
        uses: ./.github/actions/set-dotenv
        with:
          env-file: packages/react/.env
        env:
          KALTURA_PARTNER_ID: ${{ secrets.KALTURA_PARTNER_ID }}
          KALTURA_UICONF_ID: ${{ secrets.KALTURA_UICONF_ID }}
          PROFILE_HOST: ${{ secrets.PROFILE_HOST }}
      - name: Building @carbon/ibmdotcom-react storybook
        run: yarn build-storybook
        working-directory: packages/react
      - name: Deploying @carbon/ibmdotcom-react storybook to Github Pages
        run: |
          rm -rf canary/react
          mkdir -p canary
          mv packages/react/storybook-static canary/react

          git config --global user.email ${{ secrets.BOT_EMAIL }}
          git config --global user.name ${{ secrets.BOT_NAME }}
          git fetch "https://git:${BOT_TOKEN}@github.com/jeffchew/carbon-for-ibm-dotcom.git" gh-pages

          git add .
          git commit -m "chore(deploy): deploy React canary to GitHub Pages"

          if [ $? -eq 0 ]; then
            git push --force "https://git:${BOT_TOKEN}@github.com/jeffchew/carbon-for-ibm-dotcom.git" main:gh-pages > /dev/null 2>&1
          fi
#      - uses: act10ns/slack@v1
#        with:
#          status: ${{ job.status }}
